<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini System — Tasks</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Tasks</h1>
      <a class="button" href="add.html">+ Add Task</a>
    </header>
    <main>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Due Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Set up project structure</td>
            <td><span class="status status-done">done</span></td>
            <td>2026-09-10</td>
            <td class="actions">
              <a href="edit.html">Edit</a>
              <button class="delete-btn" type="button">Delete</button>
            </td>
          </tr>
          <tr>
            <td>Build the task list page</td>
            <td><span class="status status-in-progress">in-progress</span></td>
            <td>2026-09-15</td>
            <td class="actions">
              <a href="edit.html">Edit</a>
              <button class="delete-btn" type="button">Delete</button>
            </td>
          </tr>
          <tr>
            <td>Write the README</td>
            <td><span class="status status-todo">todo</span></td>
            <td>2026-09-20</td>
            <td class="actions">
              <a href="edit.html">Edit</a>
              <button class="delete-btn" type="button">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
