<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini System — Add Task</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Add Task</h1>
      <a class="button secondary" href="index.html">Back to list</a>
    </header>
    <main>
      <form class="record-form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Write the README" />

        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="todo">todo</option>
          <option value="in-progress">in-progress</option>
          <option value="done">done</option>
        </select>

        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate" />

        <div class="form-actions">
          <button class="button" type="submit">Add Task</button>
          <a class="button secondary" href="index.html">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
